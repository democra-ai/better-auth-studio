name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  build-and-lint:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10   # pnpm 11+ requires Node >=22.13; pin to keep the 18.x/20.x matrix working

      - name: Debug pnpm and lockfile
        run: |
          echo "🔍 pnpm version:"
          pnpm --version
          echo "🔍 Node version:"
          node --version
          echo "🔍 Checking for lockfile:"
          ls -la pnpm-lock.yaml || echo "❌ pnpm-lock.yaml not found"
          echo "🔍 Lockfile content (first 10 lines):"
          head -10 pnpm-lock.yaml || echo "❌ Cannot read lockfile"

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint packages
        run: pnpm run lint || echo "Linting completed with warnings"

      - name: Type check packages
        run: pnpm run type-check

      - name: Build packages
        run: pnpm build

      - name: Test build artifacts
        run: |
          # Check if main package builds successfully
          if [ -d "dist" ]; then
            echo "✅ Main package built successfully"
            ls -la dist/
          else
            echo "❌ Main package build failed - dist directory not found"
            exit 1
          fi

          # Check if frontend builds successfully
          if [ -d "public" ]; then
            echo "✅ Frontend built successfully"
            ls -la public/
          else
            echo "❌ Frontend build failed - public directory not found"
            exit 1
          fi

  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18.x, 20.x]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10   # pnpm 11+ requires Node >=22.13; pin to keep the 18.x/20.x matrix working

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Run tests
        run: pnpm test:ci

  security-audit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.x"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10   # pnpm 11+ requires Node >=22.13; pin to keep the 18.x/20.x matrix working

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies (root + frontend)
        shell: bash
        run: |
          set -euo pipefail
          if [ -f "pnpm-lock.yaml" ]; then
            echo "✅ pnpm-lock.yaml found, installing with frozen lockfile"
            pnpm install --frozen-lockfile
          else
            echo "⚠️ pnpm-lock.yaml not found, installing without frozen lockfile"
            pnpm install
          fi

          if [ -d "frontend" ]; then
            echo "📦 Installing frontend dependencies..."
            pushd frontend >/dev/null
            pnpm install --frozen-lockfile || pnpm install
            popd >/dev/null
          fi
      - name: Run security audit
        run: pnpm audit --audit-level high

      - name: Check for known vulnerabilities
        run: |
          echo "🔍 Checking for security vulnerabilities..."
          pnpm audit --json > audit-results.json || true

          # Check if there are any high or critical vulnerabilities
          if [ -f "audit-results.json" ]; then
            HIGH_VULNS=$(cat audit-results.json | jq '.metadata.vulnerabilities.high // 0')
            CRITICAL_VULNS=$(cat audit-results.json | jq '.metadata.vulnerabilities.critical // 0')
            
            if [ "$HIGH_VULNS" -gt 0 ] || [ "$CRITICAL_VULNS" -gt 0 ]; then
              echo "❌ Found $HIGH_VULNS high and $CRITICAL_VULNS critical vulnerabilities"
              echo "Please review and fix these security issues"
              exit 1
            else
              echo "✅ No high or critical vulnerabilities found"
            fi
          fi
